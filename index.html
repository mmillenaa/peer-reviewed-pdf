<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numerador & Revisor de PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- API da Adobe para visualização e anotações -->
  <script src="https://documentcloud.adobe.com/view-sdk/main.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

  <!-- Painel de Controle Superior -->
  <div class="bg-white p-6 rounded-2xl shadow-md max-w-4xl w-full text-center mb-6 border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">📄 Numerador & Revisor de PDF</h1>
    <p class="text-gray-500 text-sm mb-4">Numere as linhas do seu PDF e faça revisões com grifos, tachados e comentários na lateral.</p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
      <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      <label for="pdfInput" class="cursor-pointer bg-gray-50 hover:bg-gray-100 border-2 border-dashed border-gray-300 px-6 py-3 rounded-xl text-gray-700 font-medium transition-all">
        <span id="fileName">📁 Selecionar PDF</span>
      </label>

      <button id="btnProcess" onclick="processPDF()" disabled class="bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow">
        1. Numerar Linhas
      </button>
    </div>

    <div id="status" class="text-xs font-medium text-gray-500 mt-3 min-h-[16px]"></div>
  </div>

  <!-- Área de Visualização e Anotações (Adobe View SDK) -->
  <div id="adobe-pdf-view" class="w-full max-w-5xl h-[750px] bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200 hidden"></div>

  <script>
    // COLE SUA CHAVE DA ADOBE AQUI ABAIXO:
    const ADOBE_KEY = "60e41bac5819478c88975c8aa6b45232";

    let fileBuffer = null;
    let selectedFile = null;
    let pdfNumeradoArrayBuffer = null;

    const MAX_SIZE_MB = 20;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      const statusEl = document.getElementById('status');
      const btnProcess = document.getElementById('btnProcess');
      
      if (!file) return;

      if (file.size > MAX_SIZE_MB * 1024 * 1024) {
        statusEl.innerText = `⚠️ Arquivo muito grande. O limite é de ${MAX_SIZE_MB} MB.`;
        btnProcess.disabled = true;
        return;
      }

      statusEl.innerText = "";
      selectedFile = file;
      document.getElementById('fileName').innerText = file.name;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        fileBuffer = e.target.result;
        btnProcess.disabled = false;
      };
      reader.readAsArrayBuffer(file);
    }

    async function processPDF() {
      if (!fileBuffer) return;
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Numerando linhas...";

      try {
        const pdfjsDoc = await pdfjsLib.getDocument({ data: new Uint8Array(fileBuffer.slice(0)) }).promise;
        const pdfLibDoc = await PDFLib.PDFDocument.load(fileBuffer.slice(0));
        const font = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);

        let lineNumber = 1;
        const tolY = 4.0;
        const margemX = 20;

        for (let pageNum = 1; pageNum <= pdfjsDoc.numPages; pageNum++) {
          const pdfjsPage = await pdfjsDoc.getPage(pageNum);
          const pdfLibPage = pdfLibDoc.getPage(pageNum - 1);
          const { height: pageHeight } = pdfLibPage.getSize();
          const textContent = await pdfjsPage.getTextContent();
          
          let yCoords = [];
          for (const item of textContent.items) {
            if (!item.str || item.str.trim() === '' || !item.transform) continue;
            const yPos = item.transform[5];
            if (yPos >= 45 && yPos <= (pageHeight - 50)) {
              yCoords.push(yPos);
            }
          }

          if (yCoords.length === 0) continue;
          yCoords.sort((a, b) => b - a);

          let uniqueY = [];
          for (const y of yCoords) {
            if (uniqueY.length === 0 || Math.abs(uniqueY[uniqueY.length - 1] - y) > tolY) {
              uniqueY.push(y);
            }
          }

          for (const y of uniqueY) {
            pdfLibPage.drawText(String(lineNumber), {
              x: margemX,
              y: y,
              size: 7.5,
              font: font,
              color: PDFLib.rgb(0.8, 0, 0)
            });
            lineNumber++;
          }
        }

        const pdfBytes = await pdfLibDoc.save();
        pdfNumeradoArrayBuffer = pdfBytes.buffer;

        statusEl.innerText = "✨ Numeração concluída! Abrindo editor de anotações...";
        
        // Abre o leitor da Adobe com o PDF numerado
        carregarLeitorAdobe(pdfNumeradoArrayBuffer, selectedFile.name.replace('.pdf', '_linhas.pdf'));

      } catch (err) {
        console.error(err);
        statusEl.innerText = "❌ Erro ao numerar PDF.";
      }
    }

    function carregarLeitorAdobe(arrayBuffer, nomeArquivo) {
      document.getElementById('adobe-pdf-view').classList.remove('hidden');

      const adobeDCView = new AdobeDC.View({
        clientId: 60e41bac5819478c88975c8aa6b45232,
        divId: "adobe-pdf-view"
      });

      adobeDCView.previewFile({
        content: { promise: Promise.resolve(arrayBuffer) },
        metaData: { fileName: nomeArquivo }
      }, {
        // Habilita barra de ferramentas completa + anotações + comentários na lateral
        showAnnotationTools: true,
        showLeftHandPanel: true,
        enableAnnotationAPIs: true,
        includePDFAnnotations: true,
        dockPageControls: false
      });
    }
  </script>
</body>
</html>
