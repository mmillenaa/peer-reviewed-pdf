<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisor & Numerador de PDF (Soberano)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    .annotation-layer { position: absolute; top: 0; left: 0; cursor: crosshair; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-4">

  <!-- PAINEL SUPERIOR -->
  <div class="bg-white p-6 rounded-2xl shadow-md max-w-5xl w-full text-center mb-4 border border-gray-200">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">📄 Revisor & Numerador de PDF</h1>
    <p class="text-gray-500 text-sm mb-4">Numere as linhas do seu PDF e faça revisões sem dependência de APIs ou servidores externos.</p>

    <div class="flex flex-wrap items-center justify-center gap-4">
      <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      <label for="pdfInput" class="cursor-pointer bg-gray-50 hover:bg-gray-100 border-2 border-dashed border-gray-300 px-6 py-2.5 rounded-xl text-gray-700 font-medium transition-all text-sm">
        <span id="fileName">📁 Selecionar PDF</span>
      </label>

      <button id="btnProcess" onclick="processPDF()" disabled class="bg-red-600 hover:bg-red-700 disabled:bg-gray-300 text-white font-semibold py-2.5 px-6 rounded-xl transition-all shadow text-sm">
        Numerar e Abrir Revisor
      </button>
    </div>

    <div id="status" class="text-xs font-medium text-gray-500 mt-2 min-h-[16px]"></div>
  </div>

  <!-- WORKSPACE DE REVISÃO (Oculto até processar) -->
  <div id="workspace" class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-4 gap-4 hidden">
    
    <!-- ÁREA CENTRAL DO DOCUMENTO (3 colunas) -->
    <div class="md:col-span-3 bg-white p-4 rounded-2xl shadow border border-gray-200 flex flex-col items-center">
      
      <!-- Barra de Ferramentas de Anotação -->
      <div class="flex flex-wrap items-center justify-between w-full pb-3 mb-3 border-b border-gray-200 gap-2">
        <div class="flex items-center gap-1">
          <span class="text-xs font-semibold text-gray-500 mr-2">Ferramenta:</span>
          <button onclick="setTool('highlight')" id="tool-highlight" class="p-2 text-xs rounded-lg border bg-yellow-100 border-yellow-300 font-medium text-gray-700">🟡 Grifar</button>
          <button onclick="setTool('underline')" id="tool-underline" class="p-2 text-xs rounded-lg border bg-gray-50 border-gray-300 font-medium text-gray-700">➖ Sublinhar</button>
          <button onclick="setTool('strike')" id="tool-strike" class="p-2 text-xs rounded-lg border bg-gray-50 border-gray-300 font-medium text-gray-700">❌ Tachar</button>
          <button onclick="setTool('comment')" id="tool-comment" class="p-2 text-xs rounded-lg border bg-gray-50 border-gray-300 font-medium text-gray-700">💬 Comentar</button>
        </div>

        <!-- Cores Pastel -->
        <div class="flex items-center gap-1">
          <span class="text-xs font-semibold text-gray-500 mr-1">Cor:</span>
          <button onclick="setColor('#fef08a', [0.99, 0.94, 0.54])" class="w-6 h-6 rounded-full bg-yellow-200 border border-yellow-400 focus:ring-2 focus:ring-black"></button>
          <button onclick="setColor('#bbf7d0', [0.73, 0.97, 0.82])" class="w-6 h-6 rounded-full bg-green-200 border border-green-400 focus:ring-2 focus:ring-black"></button>
          <button onclick="setColor('#bfdbfe', [0.75, 0.86, 0.99])" class="w-6 h-6 rounded-full bg-blue-200 border border-blue-400 focus:ring-2 focus:ring-black"></button>
          <button onclick="setColor('#fecaca', [0.99, 0.79, 0.79])" class="w-6 h-6 rounded-full bg-red-200 border border-red-400 focus:ring-2 focus:ring-black"></button>
        </div>

        <!-- Navegação de Páginas -->
        <div class="flex items-center gap-2">
          <button onclick="changePage(-1)" class="px-2 py-1 bg-gray-200 text-xs font-bold rounded hover:bg-gray-300">◀</button>
          <span id="pageIndicator" class="text-xs font-semibold text-gray-600">Pág. 1/1</span>
          <button onclick="changePage(1)" class="px-2 py-1 bg-gray-200 text-xs font-bold rounded hover:bg-gray-300">▶</button>
        </div>
      </div>

      <!-- Canvas do PDF + Camada Interativa -->
      <div id="pdfContainer" class="relative border shadow-sm rounded bg-gray-50 overflow-auto max-h-[650px] w-full flex justify-center">
        <div class="relative inline-block">
          <canvas id="pdfCanvas"></canvas>
          <svg id="svgOverlay" class="annotation-layer"></svg>
        </div>
      </div>
    </div>

    <!-- PAINEL LATERAL DE COMENTÁRIOS (1 coluna) -->
    <div class="bg-white p-4 rounded-2xl shadow border border-gray-200 flex flex-col">
      <h2 class="text-base font-bold text-gray-800 mb-3 pb-2 border-b flex justify-between items-center">
        <span>💬 Anotações</span>
        <button onclick="downloadFinalPDF()" class="bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition-all shadow">
          ⬇️ Baixar PDF
        </button>
      </h2>
      
      <div id="commentsList" class="flex-1 overflow-y-auto space-y-3 max-h-[600px] text-xs">
        <p class="text-gray-400 italic text-center mt-6">Nenhum comentário adicionado ainda.</p>
      </div>
    </div>

  </div>

  <script>
    let fileBuffer = null;
    let selectedFile = null;
    let pdfLibDoc = null;
    let pdfjsDoc = null;
    
    let currentPage = 1;
    let activeTool = 'highlight'; // 'highlight', 'underline', 'strike', 'comment'
    let activeColorHex = '#fef08a';
    let activeColorRGB = [0.99, 0.94, 0.54];
    
    let annotations = []; // Armazena todas as anotações feitas
    let isDrawing = false;
    let startX = 0, startY = 0;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      selectedFile = file;
      document.getElementById('fileName').innerText = file.name;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        fileBuffer = e.target.result;
        document.getElementById('btnProcess').disabled = false;
      };
      reader.readAsArrayBuffer(file);
    }

    // 1. NUMERAÇÃO DAS LINHAS
    async function processPDF() {
      if (!fileBuffer) return;
      const statusEl = document.getElementById('status');
      statusEl.innerText = "Numerando linhas do PDF...";

      try {
        const pdfjsData = new Uint8Array(fileBuffer.slice(0));
        const tempPdfjs = await pdfjsLib.getDocument({ data: pdfjsData }).promise;
        pdfLibDoc = await PDFLib.PDFDocument.load(fileBuffer.slice(0));
        const font = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);

        let lineNumber = 1;
        const tolY = 4.0;
        const margemX = 20;

        for (let pageNum = 1; pageNum <= tempPdfjs.numPages; pageNum++) {
          const pdfjsPage = await tempPdfjs.getPage(pageNum);
          const pdfLibPage = pdfLibDoc.getPage(pageNum - 1);
          const { height: pageHeight } = pdfLibPage.getSize();
          const textContent = await pdfjsPage.getTextContent();
          
          let yCoords = [];
          for (const item of textContent.items) {
            if (!item.str || item.str.trim() === '' || !item.transform) continue;
            const yPos = item.transform[5];
            if (yPos >= 45 && yPos <= (pageHeight - 50)) yCoords.push(yPos);
          }

          if (yCoords.length === 0) continue;
          yCoords.sort((a, b) => b - a);

          let uniqueY = [];
          for (const y of yCoords) {
            if (uniqueY.length === 0 || Math.abs(uniqueY[uniqueY.length - 1] - y) > tolY) {
              uniqueY.push(y);
            }
          }

          for (const y of uniqueY) {
            pdfLibPage.drawText(String(lineNumber), {
              x: margemX, y: y, size: 7.5, font: font, color: PDFLib.rgb(0.8, 0, 0)
            });
            lineNumber++;
          }
        }

        const numeradoBytes = await pdfLibDoc.save();
        statusEl.innerText = "✨ Numeração concluída! Carregando leitor de revisão...";

        // Carrega o PDF numerado para visualização no Canvas
        pdfjsDoc = await pdfjsLib.getDocument({ data: numeradoBytes }).promise;
        document.getElementById('workspace').classList.remove('hidden');
        renderPage(1);

      } catch (err) {
        console.error(err);
        statusEl.innerText = "❌ Erro ao processar PDF.";
      }
    }

    // 2. RENDERIZAÇÃO NO CANVAS E SVG OVERLAY
    async function renderPage(pageNum) {
      currentPage = pageNum;
      document.getElementById('pageIndicator').innerText = `Pág. ${pageNum}/${pdfjsDoc.numPages}`;
      
      const page = await pdfjsDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: 1.3 });

      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const svg = document.getElementById('svgOverlay');
      svg.setAttribute('width', viewport.width);
      svg.setAttribute('height', viewport.height);

      await page.render({ canvasContext: context, viewport: viewport }).promise;
      redrawAnnotations();
    }

    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage >= 1 && newPage <= pdfjsDoc.numPages) {
        renderPage(newPage);
      }
    }

    // 3. SELEÇÃO DE FERRAMENTAS E CORES
    function setTool(tool) {
      activeTool = tool;
      ['highlight', 'underline', 'strike', 'comment'].forEach(t => {
        const btn = document.getElementById(`tool-${t}`);
        if (t === tool) {
          btn.className = "p-2 text-xs rounded-lg border bg-red-100 border-red-300 font-semibold text-red-700 shadow-sm";
        } else {
          btn.className = "p-2 text-xs rounded-lg border bg-gray-50 border-gray-300 font-medium text-gray-700";
        }
      });
    }

    function setColor(hex, rgb) {
      activeColorHex = hex;
      activeColorRGB = rgb;
    }

    // 4. CAPTURA DE CLIQUES E DESENHO NA TELA
    const svg = document.getElementById('svgOverlay');

    svg.addEventListener('mousedown', (e) => {
      const rect = svg.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;
      isDrawing = true;
    });

    svg.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const rect = svg.getBoundingClientRect();
      const endX = e.clientX - rect.left;
      const endY = e.clientY - rect.top;

      const width = Math.abs(endX - startX);
      const height = Math.abs(endY - startY);

      if (activeTool === 'comment') {
        const texto = prompt("Digite seu comentário para este ponto:");
        if (texto) {
          annotations.push({
            type: 'comment',
            page: currentPage,
            x: startX,
            y: startY,
            text: texto,
            colorHex: activeColorHex,
            colorRGB: activeColorRGB
          });
        }
      } else if (width > 5 || height > 5) {
        annotations.push({
          type: activeTool,
          page: currentPage,
          x: Math.min(startX, endX),
          y: Math.min(startY, endY),
          w: width,
          h: height,
          colorHex: activeColorHex,
          colorRGB: activeColorRGB
        });
      }

      redrawAnnotations();
      updateCommentsList();
    });

    function redrawAnnotations() {
      const svg = document.getElementById('svgOverlay');
      svg.innerHTML = '';

      const pageAnns = annotations.filter(a => a.page === currentPage);
      pageAnns.forEach((ann, i) => {
        if (ann.type === 'highlight') {
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', ann.x);
          rect.setAttribute('y', ann.y);
          rect.setAttribute('width', ann.w);
          rect.setAttribute('height', ann.h);
          rect.setAttribute('fill', ann.colorHex);
          rect.setAttribute('opacity', '0.45');
          svg.appendChild(rect);
        } else if (ann.type === 'underline') {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', ann.x);
          line.setAttribute('y1', ann.y + ann.h);
          line.setAttribute('x2', ann.x + ann.w);
          line.setAttribute('y2', ann.y + ann.h);
          line.setAttribute('stroke', ann.colorHex);
          line.setAttribute('stroke-width', '3');
          svg.appendChild(line);
        } else if (ann.type === 'strike') {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', ann.x);
          line.setAttribute('y1', ann.y + (ann.h / 2));
          line.setAttribute('x2', ann.x + ann.w);
          line.setAttribute('y2', ann.y + (ann.h / 2));
          line.setAttribute('stroke', '#ef4444');
          line.setAttribute('stroke-width', '2');
          svg.appendChild(line);
        } else if (ann.type === 'comment') {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', ann.x);
          circle.setAttribute('cy', ann.y);
          circle.setAttribute('r', '10');
          circle.setAttribute('fill', '#dc2626');
          svg.appendChild(circle);

          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', ann.x - 4);
          text.setAttribute('y', ann.y + 4);
          text.setAttribute('fill', '#ffffff');
          text.setAttribute('font-size', '10');
          text.setAttribute('font-weight', 'bold');
          text.textContent = '💬';
          svg.appendChild(text);
        }
      });
    }

    function updateCommentsList() {
      const container = document.getElementById('commentsList');
      container.innerHTML = '';

      const comments = annotations.filter(a => a.type === 'comment');
      if (comments.length === 0) {
        container.innerHTML = '<p class="text-gray-400 italic text-center mt-6">Nenhum comentário adicionado ainda.</p>';
        return;
      }

      comments.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = "p-2.5 bg-gray-50 border rounded-xl text-xs space-y-1";
        item.innerHTML = `
          <div class="flex justify-between items-center text-gray-500 font-semibold">
            <span>Página ${c.page}</span>
            <button onclick="deleteAnnotation(${idx})" class="text-red-500 hover:underline">Excluir</button>
          </div>
          <p class="text-gray-800 font-medium">${c.text}</p>
        `;
        container.appendChild(item);
      });
    }

    function deleteAnnotation(idx) {
      const comments = annotations.filter(a => a.type === 'comment');
      const target = comments[idx];
      annotations = annotations.filter(a => a !== target);
      redrawAnnotations();
      updateCommentsList();
    }

    // 5. EMBUTIR TUDO NO PDF FINAL E BAIXAR
    async function downloadFinalPDF() {
      const pages = pdfLibDoc.getPages();
      const scale = 1.3;

      for (const ann of annotations) {
        const page = pages[ann.page - 1];
        const { height: pageHeight } = page.getSize();

        // Converte coordenadas do Canvas/SVG para coordenadas oficiais do PDF (Y invertido)
        const pdfX = ann.x / scale;
        const pdfY = pageHeight - (ann.y / scale);
        const pdfW = (ann.w || 0) / scale;
        const pdfH = (ann.h || 0) / scale;

        const [r, g, b] = ann.colorRGB;

        if (ann.type === 'highlight') {
          page.drawRectangle({
            x: pdfX,
            y: pdfY - pdfH,
            width: pdfW,
            height: pdfH,
            color: PDFLib.rgb(r, g, b),
            opacity: 0.45
          });
        } else if (ann.type === 'underline') {
          page.drawLine({
            start: { x: pdfX, y: pdfY - pdfH },
            end: { x: pdfX + pdfW, y: pdfY - pdfH },
            thickness: 1.5,
            color: PDFLib.rgb(r, g, b)
          });
        } else if (ann.type === 'strike') {
          page.drawLine({
            start: { x: pdfX, y: pdfY - (pdfH / 2) },
            end: { x: pdfX + pdfW, y: pdfY - (pdfH / 2) },
            thickness: 1.5,
            color: PDFLib.rgb(0.9, 0.2, 0.2)
          });
        } else if (ann.type === 'comment') {
          page.drawCircle({
            x: pdfX,
            y: pdfY,
            size: 6,
            color: PDFLib.rgb(0.8, 0, 0)
          });
        }
      }

      const finalBytes = await pdfLibDoc.save();
      const blob = new Blob([finalBytes], { type: 'application/pdf' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = selectedFile.name.replace('.pdf', '_revisado.pdf');
      link.click();
    }
  </script>
</body>
</html>
