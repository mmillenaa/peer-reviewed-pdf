<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisor & Numerador de PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    /* Estilos essenciais para a Camada de Texto invisível sobrepor o Canvas perfeitamente */
    #pdfWrapper { position: relative; display: inline-block; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    canvas { display: block; }
    .textLayer {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      overflow: hidden; opacity: 0.2; /* Deixe em 0 na versão final para ficar invisível */
      line-height: 1.0;
    }
    .textLayer ::selection { background: rgba(0, 0, 255, 0.3); }
    .textLayer span {
      color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%;
    }
    .annotationLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    
    /* Quando a ferramenta for comentário, alterar o cursor */
    .tool-comment .textLayer { cursor: crosshair; }
    .tool-comment .textLayer span { cursor: crosshair; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6 font-sans">

  <!-- Painel Principal de Upload e Ações -->
  <div class="bg-white p-8 rounded-xl shadow-sm max-w-4xl w-full text-center mb-6 border border-gray-200">
    <h1 class="text-2xl font-semibold text-gray-800 mb-2">Revisor & Numerador de PDF</h1>
    <p class="text-gray-500 text-sm mb-6">Ferramenta independente para numeração de linhas e revisão de documentos.</p>

    <!-- Upload -->
    <div class="flex flex-col items-center justify-center gap-4 mb-6">
      <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      <label for="pdfInput" class="cursor-pointer bg-gray-50 hover:bg-gray-100 border border-gray-300 px-6 py-3 rounded text-gray-700 font-medium transition-colors text-sm flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
        <span id="fileName">Selecionar Arquivo PDF</span>
      </label>
    </div>

    <!-- 3 Botões de Ação -->
    <div class="flex flex-wrap justify-center gap-3">
      <button id="btnNumberOnly" onclick="startProcess('number')" disabled class="action-btn bg-gray-800 hover:bg-gray-900 disabled:bg-gray-300 text-white font-medium py-2 px-4 rounded transition-colors text-sm">
        Somente Numerar Linhas
      </button>
      <button id="btnAnnotateOnly" onclick="startProcess('annotate')" disabled class="action-btn bg-gray-800 hover:bg-gray-900 disabled:bg-gray-300 text-white font-medium py-2 px-4 rounded transition-colors text-sm">
        Somente Comentar/Revisar
      </button>
      <button id="btnBoth" onclick="startProcess('both')" disabled class="action-btn bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white font-medium py-2 px-4 rounded transition-colors text-sm">
        Numerar e Revisar
      </button>
    </div>
    
    <div id="statusMsg" class="text-xs font-medium text-gray-500 mt-4 min-h-[16px]"></div>
  </div>

  <!-- Workspace de Revisão -->
  <div id="workspace" class="max-w-7xl w-full grid grid-cols-1 md:grid-cols-4 gap-6 hidden">
    
    <!-- Painel Lateral: Ferramentas e Lista de Comentários -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-[750px] overflow-hidden">
      
      <!-- Toolbar -->
      <div class="p-4 border-b border-gray-100 bg-gray-50">
        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-3">Ferramentas</span>
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button onclick="setTool('highlight')" id="tool-highlight" class="tool-btn border border-gray-300 bg-white py-1.5 rounded text-xs font-medium text-gray-700">Grifar</button>
          <button onclick="setTool('underline')" id="tool-underline" class="tool-btn border border-gray-300 bg-white py-1.5 rounded text-xs font-medium text-gray-700">Sublinhar</button>
          <button onclick="setTool('strike')" id="tool-strike" class="tool-btn border border-gray-300 bg-white py-1.5 rounded text-xs font-medium text-gray-700">Tachar</button>
          <button onclick="setTool('comment')" id="tool-comment" class="tool-btn border border-gray-300 bg-white py-1.5 rounded text-xs font-medium text-gray-700">Comentar</button>
        </div>
        
        <span class="text-xs font-bold text-gray-500 uppercase tracking-wider block mb-2">Cor</span>
        <div class="flex gap-2">
          <button onclick="setColor('#fef08a', [0.99, 0.94, 0.54])" class="w-6 h-6 rounded-sm bg-yellow-200 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"></button>
          <button onclick="setColor('#bbf7d0', [0.73, 0.97, 0.82])" class="w-6 h-6 rounded-sm bg-green-200 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"></button>
          <button onclick="setColor('#bfdbfe', [0.75, 0.86, 0.99])" class="w-6 h-6 rounded-sm bg-blue-200 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"></button>
          <button onclick="setColor('#fecaca', [0.99, 0.79, 0.79])" class="w-6 h-6 rounded-sm bg-red-200 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"></button>
        </div>
      </div>

      <!-- Lista de Ações -->
      <div class="flex-1 overflow-y-auto p-4 bg-white" id="sidebarList">
        <p class="text-gray-400 text-xs italic text-center mt-4">Nenhuma anotação. Selecione o texto no PDF para marcar ou clique para comentar.</p>
      </div>

      <!-- Botão Baixar Final -->
      <div class="p-4 border-t border-gray-100 bg-gray-50">
        <button onclick="downloadFinalPDF()" class="w-full bg-green-600 hover:bg-green-700 text-white text-sm font-medium py-2.5 rounded transition-colors flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Salvar Arquivo Final
        </button>
      </div>
    </div>

    <!-- Visualizador Central -->
    <div class="md:col-span-3 bg-gray-50 rounded-xl border border-gray-200 flex flex-col overflow-hidden h-[750px]">
      <div class="bg-white border-b border-gray-200 p-2 flex justify-between items-center px-4">
        <span class="text-sm font-medium text-gray-700" id="pageIndicator">Página 1</span>
        <div class="flex gap-1">
          <button onclick="changePage(-1)" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 text-sm">Anterior</button>
          <button onclick="changePage(1)" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50 text-sm">Próxima</button>
        </div>
      </div>
      
      <div class="flex-1 overflow-auto p-6 flex justify-center bg-gray-100 relative" id="scrollContainer">
        <!-- O Wrapper engloba o Canvas, a Camada de Texto e a Camada de Desenho SVG -->
        <div id="pdfWrapper">
          <canvas id="pdfCanvas"></canvas>
          <div id="textLayer" class="textLayer"></div>
          <svg id="svgOverlay" class="annotationLayer"></svg>
        </div>
      </div>
    </div>

  </div>

  <script>
    let rawFileBuffer = null;
    let fileName = "";
    
    // Controle do PDF (Leitura e Escrita)
    let pdfjsDoc = null;
    let pdfLibDoc = null;
    
    // Estado da Interface
    let currentPage = 1;
    let activeTool = 'highlight'; // highlight, underline, strike, comment
    let activeColorHex = '#fef08a';
    let activeColorRGB = [0.99, 0.94, 0.54];
    let annotations = []; // Guarda o histórico de marcações
    let scale = 1.3;

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      fileName = file.name;
      document.getElementById('fileName').innerText = fileName;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        rawFileBuffer = e.target.result;
        document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
      };
      reader.readAsArrayBuffer(file);
    }

    function setStatus(text, isError = false) {
      const el = document.getElementById('statusMsg');
      el.innerText = text;
      el.className = `text-xs font-medium mt-4 min-h-[16px] ${isError ? 'text-red-600' : 'text-gray-500'}`;
    }

    // --- LÓGICA DOS 3 BOTÕES ---
    async function startProcess(mode) {
      if (!rawFileBuffer) return;
      setStatus("Processando documento...");
      
      try {
        let bufferToLoad = rawFileBuffer.slice(0);

        if (mode === 'number' || mode === 'both') {
          bufferToLoad = await applyNumbering(bufferToLoad);
        }

        if (mode === 'number') {
          // Apenas numerar e baixar diretamente, sem abrir editor
          const blob = new Blob([bufferToLoad], { type: 'application/pdf' });
          triggerDownload(blob, fileName.replace('.pdf', '_numerado.pdf'));
          setStatus("Download concluído.");
          return;
        }

        // Se for annotate ou both, abre o workspace
        pdfLibDoc = await PDFLib.PDFDocument.load(bufferToLoad);
        pdfjsDoc = await pdfjsLib.getDocument({ data: bufferToLoad }).promise;
        
        document.getElementById('workspace').classList.remove('hidden');
        document.getElementById('statusMsg').parentElement.classList.add('hidden'); // esconde o cabeçalho
        
        setTool('highlight');
        renderPage(1);
        
      } catch (err) {
        console.error(err);
        setStatus("Erro ao processar o PDF.", true);
      }
    }

    // --- FUNÇÃO DE NUMERAÇÃO DE LINHAS (PyMuPDF migrado) ---
    async function applyNumbering(buffer) {
      const tempPdfjs = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
      const tempLibDoc = await PDFLib.PDFDocument.load(buffer.slice(0));
      const font = await tempLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      let lineNumber = 1;
      const tolY = 4.0;
      const margemX = 20;

      for (let pageNum = 1; pageNum <= tempPdfjs.numPages; pageNum++) {
        const pdfjsPage = await tempPdfjs.getPage(pageNum);
        const pdfLibPage = tempLibDoc.getPage(pageNum - 1);
        const { height: pageHeight } = pdfLibPage.getSize();
        const textContent = await pdfjsPage.getTextContent();
        
        let yCoords = [];
        for (const item of textContent.items) {
          if (!item.str || item.str.trim() === '' || !item.transform) continue;
          const yPos = item.transform[5];
          if (yPos >= 45 && yPos <= (pageHeight - 50)) yCoords.push(yPos);
        }

        if (yCoords.length === 0) continue;
        yCoords.sort((a, b) => b - a);

        let uniqueY = [];
        for (const y of yCoords) {
          if (uniqueY.length === 0 || Math.abs(uniqueY[uniqueY.length - 1] - y) > tolY) {
            uniqueY.push(y);
          }
        }

        for (const y of uniqueY) {
          pdfLibPage.drawText(String(lineNumber), {
            x: margemX, y: y, size: 7.5, font: font, color: PDFLib.rgb(0.5, 0.5, 0.5)
          });
          lineNumber++;
        }
      }
      return await tempLibDoc.save();
    }

    // --- RENDERIZAÇÃO DO VIEWER E CAMADA DE TEXTO ---
    async function renderPage(pageNum) {
      currentPage = pageNum;
      document.getElementById('pageIndicator').innerText = `Página ${pageNum} de ${pdfjsDoc.numPages}`;
      
      const page = await pdfjsDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const wrapper = document.getElementById('pdfWrapper');
      wrapper.style.width = `${viewport.width}px`;
      wrapper.style.height = `${viewport.height}px`;

      const svg = document.getElementById('svgOverlay');
      svg.setAttribute('width', viewport.width);
      svg.setAttribute('height', viewport.height);

      // Renderiza o visual do PDF
      await page.render({ canvasContext: context, viewport: viewport }).promise;

      // Renderiza a Camada de Texto invisível para permitir seleção via mouse
      const textLayerDiv = document.getElementById('textLayer');
      textLayerDiv.innerHTML = '';
      const textContent = await page.getTextContent();
      
      // Constrói a estrutura de spans para seleção
      pdfjsLib.renderTextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
      });

      redrawAnnotations();
    }

    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage >= 1 && newPage <= pdfjsDoc.numPages) {
        renderPage(newPage);
      }
    }

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('bg-gray-800', 'text-white', 'border-gray-800');
        btn.classList.add('bg-white', 'text-gray-700', 'border-gray-300');
      });
      const activeBtn = document.getElementById(`tool-${tool}`);
      activeBtn.classList.add('bg-gray-800', 'text-white', 'border-gray-800');
      activeBtn.classList.remove('bg-white', 'text-gray-700', 'border-gray-300');

      document.getElementById('pdfWrapper').className = `tool-${tool}`;
    }

    function setColor(hex, rgb) {
      activeColorHex = hex;
      activeColorRGB = rgb;
    }

    // --- CAPTURA DE TEXTO SELECIONADO E CLIQUES ---
    document.getElementById('textLayer').addEventListener('mouseup', function(e) {
      if (activeTool === 'comment') {
        // Modo comentário: pega a coordenada do clique
        const rect = this.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const annId = Date.now();
        annotations.push({
          id: annId, type: 'comment', page: currentPage, text: '',
          x: x, y: y, colorHex: activeColorHex, colorRGB: activeColorRGB
        });
        
        redrawAnnotations();
        updateSidebar();
        
        // Foca automaticamente na nova caixa de texto
        setTimeout(() => {
          const txtArea = document.getElementById(`textarea-${annId}`);
          if(txtArea) txtArea.focus();
        }, 50);

        return;
      }

      // Modo de Texto (Grifo, Sublinhado, Tachado)
      const selection = window.getSelection();
      if (selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const rects = range.getClientRects();
      const wrapperRect = this.getBoundingClientRect();

      let capturedRects = [];
      for (let i = 0; i < rects.length; i++) {
        const r = rects[i];
        capturedRects.push({
          x: r.left - wrapperRect.left,
          y: r.top - wrapperRect.top,
          w: r.width,
          h: r.height
        });
      }

      if (capturedRects.length > 0) {
        annotations.push({
          id: Date.now(),
          type: activeTool,
          page: currentPage,
          rects: capturedRects,
          colorHex: activeColorHex,
          colorRGB: activeColorRGB,
          text: selection.toString() // Salva o texto selecionado para referência na sidebar
        });
      }

      selection.removeAllRanges();
      redrawAnnotations();
      updateSidebar();
    });

    // --- DESENHO NA TELA (Camada SVG) ---
    function redrawAnnotations() {
      const svg = document.getElementById('svgOverlay');
      svg.innerHTML = '';

      const pageAnns = annotations.filter(a => a.page === currentPage);
      
      pageAnns.forEach(ann => {
        if (ann.type === 'comment') {
          // Desenha um ícone de balão de fala simples
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', 'M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z');
          path.setAttribute('fill', '#ffffff');
          path.setAttribute('stroke', '#374151');
          path.setAttribute('stroke-width', '1.5');
          path.setAttribute('transform', `translate(${ann.x - 12}, ${ann.y - 12}) scale(1)`);
          g.appendChild(path);
          svg.appendChild(g);
        } else {
          // Renderiza os retângulos de seleção de texto
          ann.rects.forEach(r => {
            if (ann.type === 'highlight') {
              const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
              rect.setAttribute('x', r.x); rect.setAttribute('y', r.y);
              rect.setAttribute('width', r.w); rect.setAttribute('height', r.h);
              rect.setAttribute('fill', ann.colorHex); rect.setAttribute('opacity', '0.45');
              svg.appendChild(rect);
            } else if (ann.type === 'underline') {
              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', r.x); line.setAttribute('y1', r.y + r.h - 1);
              line.setAttribute('x2', r.x + r.w); line.setAttribute('y2', r.y + r.h - 1);
              line.setAttribute('stroke', ann.colorHex); line.setAttribute('stroke-width', '2');
              svg.appendChild(line);
            } else if (ann.type === 'strike') {
              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', r.x); line.setAttribute('y1', r.y + (r.h / 2));
              line.setAttribute('x2', r.x + r.w); line.setAttribute('y2', r.y + (r.h / 2));
              line.setAttribute('stroke', '#ef4444'); line.setAttribute('stroke-width', '1.5');
              svg.appendChild(line);
            }
          });
        }
      });
    }

    // --- PAINEL LATERAL (Gerenciamento e Exclusão) ---
    function updateSidebar() {
      const container = document.getElementById('sidebarList');
      container.innerHTML = '';

      if (annotations.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-xs italic text-center mt-4">Nenhuma anotação.</p>';
        return;
      }

      annotations.forEach(ann => {
        const item = document.createElement('div');
        item.className = "p-3 mb-3 bg-white border border-gray-200 rounded-lg shadow-sm text-sm";
        
        // Cabeçalho da anotação
        let typeLabel = ann.type === 'highlight' ? 'Grifo' : ann.type === 'underline' ? 'Sublinhado' : ann.type === 'strike' ? 'Tachado' : 'Comentário';
        
        let html = `
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-gray-600 bg-gray-100 px-2 py-1 rounded">Pág. ${ann.page} | ${typeLabel}</span>
            <button onclick="removeAnnotation(${ann.id})" class="text-gray-400 hover:text-red-600 transition-colors" title="Excluir">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `;

        if (ann.type === 'comment') {
          html += `<textarea id="textarea-${ann.id}" onchange="updateCommentText(${ann.id}, this.value)" class="w-full text-sm border border-gray-200 rounded p-2 focus:ring-1 focus:ring-blue-500 focus:border-blue-500 min-h-[60px] resize-y" placeholder="Digite seu comentário aqui...">${ann.text}</textarea>`;
        } else {
          // Mostra um trecho do texto que foi marcado
          const snippet = ann.text.length > 50 ? ann.text.substring(0, 50) + "..." : ann.text;
          html += `<div class="text-gray-600 text-xs border-l-2 border-gray-300 pl-2 italic">"${snippet}"</div>`;
        }

        item.innerHTML = html;
        container.appendChild(item);
      });
    }

    window.updateCommentText = function(id, text) {
      const ann = annotations.find(a => a.id === id);
      if(ann) ann.text = text;
    };

    window.removeAnnotation = function(id) {
      annotations = annotations.filter(a => a.id !== id);
      redrawAnnotations();
      updateSidebar();
    };

    // --- SALVAR NO PDF (pdf-lib) ---
    async function downloadFinalPDF() {
      const pages = pdfLibDoc.getPages();

      for (const ann of annotations) {
        const page = pages[ann.page - 1];
        const { height: pageHeight } = page.getSize();
        const [r, g, b] = ann.colorRGB;

        if (ann.type === 'comment') {
          const pdfX = ann.x / scale;
          const pdfY = pageHeight - (ann.y / scale);
          
          // Adiciona o comentário como texto no PDF físico
          page.drawText(`[Comentário: ${ann.text}]`, {
            x: pdfX, y: pdfY, size: 10, color: PDFLib.rgb(0.2, 0.2, 0.2)
          });
        } else {
          ann.rects.forEach(rect => {
            const pdfX = rect.x / scale;
            const pdfY = pageHeight - (rect.y / scale);
            const pdfW = rect.w / scale;
            const pdfH = rect.h / scale;

            if (ann.type === 'highlight') {
              page.drawRectangle({ x: pdfX, y: pdfY - pdfH, width: pdfW, height: pdfH, color: PDFLib.rgb(r, g, b), opacity: 0.45 });
            } else if (ann.type === 'underline') {
              page.drawLine({ start: { x: pdfX, y: pdfY - pdfH }, end: { x: pdfX + pdfW, y: pdfY - pdfH }, thickness: 1.5, color: PDFLib.rgb(r, g, b) });
            } else if (ann.type === 'strike') {
              page.drawLine({ start: { x: pdfX, y: pdfY - (pdfH / 2) }, end: { x: pdfX + pdfW, y: pdfY - (pdfH / 2) }, thickness: 1.5, color: PDFLib.rgb(0.9, 0.2, 0.2) });
            }
          });
        }
      }

      const finalBytes = await pdfLibDoc.save();
      const blob = new Blob([finalBytes], { type: 'application/pdf' });
      triggerDownload(blob, fileName.replace('.pdf', '_revisado.pdf'));
    }

    function triggerDownload(blob, outputName) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = outputName;
      link.click();
    }
  </script>
</body>
</html>
