<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar e Numerar PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    /* Estilos para a Camada de Texto invisível */
    #pdfWrapper { position: relative; display: inline-block; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    canvas { display: block; }
    .textLayer {
      position: absolute; left: 0; top: 0; right: 0; bottom: 0;
      overflow: hidden; opacity: 0.2; /* Deixe em 0 na versão de produção */
      line-height: 1.0;
    }
    .textLayer ::selection { background: rgba(0, 0, 255, 0.3); }
    .textLayer span {
      color: transparent; position: absolute; white-space: pre; cursor: text; transform-origin: 0% 0%;
    }
    .annotationLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans transition-all duration-300" id="mainBody">

  <!-- TELA INICIAL (Caixa Flutuante Centralizada) -->
  <div id="startScreen" class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-gray-100 flex flex-col items-center">
    
    <!-- Logo do App -->
    <img src="logo.png" alt="Logo" class="h-20 w-auto object-contain mx-auto mb-4" onerror="this.style.display='none'">
    
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Revisar e numerar PDF</h1>
    <p class="text-gray-500 text-sm mb-6">Numere linhas e ancore comentários no seu documento PDF.</p>

    <!-- Upload -->
    <div class="w-full border-2 border-dashed border-gray-300 rounded-xl p-6 mb-5 hover:border-red-400 transition-colors bg-gray-50/50">
      <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      <label for="pdfInput" class="cursor-pointer flex flex-col items-center">
        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <span class="text-gray-600 text-sm font-medium" id="fileName">Escolha um PDF</span>
      </label>
    </div>

    <!-- Botões de Ação Atualizados -->
    <div class="flex flex-col w-full gap-3">
      <button id="btnBoth" onclick="startProcess('both')" disabled class="action-btn w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md">
        Abrir Revisor
      </button>
      <button id="btnNumberOnly" onclick="startProcess('number')" disabled class="action-btn w-full bg-gray-50 hover:bg-gray-100 border border-gray-200 disabled:bg-gray-100 disabled:border-gray-200 disabled:text-gray-400 text-gray-600 font-medium py-2 rounded-lg transition-all text-sm">
        Apenas numerar linhas (Download)
      </button>
    </div>
    
    <div id="statusMsg" class="text-xs font-medium text-gray-500 mt-4 h-4"></div>

    <!-- RODAPÉ - MILLENA FRANCO -->
    <div class="mt-8 pt-5 border-t border-gray-100 w-full flex flex-col items-center gap-3">
      <p class="text-xs text-gray-500">
        Desenvolvido por <a href="https://mmillenaa.github.io/millena/" target="_blank" class="text-blue-600 font-semibold hover:underline">Millena Miranda Franco</a>
      </p>
      
      <!-- Badges Acadêmicos (Atualizados com as imagens) -->
      <div class="flex flex-wrap justify-center items-center gap-4 text-[11px] font-bold text-gray-500 uppercase tracking-wide">
        <!-- Lattes -->
        <a href="http://buscatextual.cnpq.br/buscatextual/visualizacv.do?metodo=apresentar&id=K2465526E7" target="_blank" class="flex items-center gap-1.5 hover:text-blue-900 transition-colors">
          <img src="http://www2.ufac.br/ccsd/saudecoletiva/iconlattes.png" alt="Lattes" class="h-4 w-auto rounded-sm object-contain">
          CV Lattes
        </a>
        
        <!-- ORCID -->
        <a href="https://orcid.org/0000-0002-0292-0797" target="_blank" class="flex items-center gap-1.5 hover:text-green-700 transition-colors">
          <img src="https://upload.wikimedia.org/wikipedia/commons/0/06/ORCID_iD.svg" alt="ORCID" class="h-4 w-auto object-contain">
          ORCID
        </a>
        
        <!-- BV FAPESP -->
        <a href="https://bv.fapesp.br/pt/pesquisador/743339/millena-miranda-franco/" target="_blank" class="flex items-center gap-1.5 hover:text-teal-700 transition-colors">
          <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Logo_BV_FAPESP.jpg" alt="BV FAPESP" class="h-4 w-auto rounded-sm object-contain">
          BV FAPESP
        </a>
      </div>
    </div>
  </div>

  <!-- WORKSPACE DE REVISÃO (Oculto inicialmente) -->
  <div id="workspace" class="max-w-7xl w-full grid-cols-1 md:grid-cols-4 gap-6 hidden">
    
    <!-- Visualizador Central -->
    <div class="md:col-span-3 bg-gray-50 rounded-xl border border-gray-200 flex flex-col overflow-hidden h-[85vh] shadow-lg">
      <div class="bg-white border-b border-gray-200 p-3 flex justify-between items-center px-4">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-700 bg-gray-100 px-3 py-1 rounded-full" id="pageIndicator">Página 1</span>
        </div>
        <div class="flex gap-2">
          <button onclick="changePage(-1)" class="px-4 py-1.5 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm font-medium shadow-sm transition-all">Anterior</button>
          <button onclick="changePage(1)" class="px-4 py-1.5 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-sm font-medium shadow-sm transition-all">Próxima</button>
        </div>
      </div>
      
      <div class="flex-1 overflow-auto p-8 flex justify-center bg-gray-200 relative" id="scrollContainer">
        <!-- O Wrapper engloba o Canvas, a Camada de Texto e a Camada de Desenho SVG -->
        <div id="pdfWrapper">
          <canvas id="pdfCanvas"></canvas>
          <div id="textLayer" class="textLayer"></div>
          <svg id="svgOverlay" class="annotationLayer"></svg>
        </div>
      </div>
    </div>

    <!-- Painel Lateral: Ferramentas e Lista de Comentários -->
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col h-[85vh] overflow-hidden">
      
      <!-- Toolbar -->
      <div class="p-5 border-b border-gray-100 bg-gray-50">
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-3">Ferramenta Ativa</span>
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button onclick="setTool('highlight')" id="tool-highlight" class="tool-btn py-2 rounded-lg text-xs font-semibold border transition-all">Grifar</button>
          <button onclick="setTool('comment')" id="tool-comment" class="tool-btn py-2 rounded-lg text-xs font-semibold border transition-all">Comentar</button>
          <button onclick="setTool('underline')" id="tool-underline" class="tool-btn py-2 rounded-lg text-xs font-semibold border transition-all">Sublinhar</button>
          <button onclick="setTool('strike')" id="tool-strike" class="tool-btn py-2 rounded-lg text-xs font-semibold border transition-all">Tachar</button>
        </div>
        
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Cor da Marcação</span>
        <div class="flex gap-3">
          <button onclick="setColor('#fef08a', [0.99, 0.94, 0.54])" class="w-7 h-7 rounded-full bg-yellow-200 border-2 border-yellow-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-400 transition-all"></button>
          <button onclick="setColor('#bbf7d0', [0.73, 0.97, 0.82])" class="w-7 h-7 rounded-full bg-green-200 border-2 border-green-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-400 transition-all"></button>
          <button onclick="setColor('#bfdbfe', [0.75, 0.86, 0.99])" class="w-7 h-7 rounded-full bg-blue-200 border-2 border-blue-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-400 transition-all"></button>
          <button onclick="setColor('#fecaca', [0.99, 0.79, 0.79])" class="w-7 h-7 rounded-full bg-red-200 border-2 border-red-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-400 transition-all"></button>
        </div>
      </div>

      <!-- Lista de Ações -->
      <div class="flex-1 overflow-y-auto p-4 bg-white space-y-3" id="sidebarList">
        <p class="text-gray-400 text-sm text-center mt-8 px-4">Selecione o texto no PDF para marcar ou adicionar comentários paralelos.</p>
      </div>

      <!-- Botão Baixar Final -->
      <div class="p-4 border-t border-gray-100 bg-white">
        <button onclick="downloadFinalPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
          ⬇️ Baixar PDF final
        </button>
      </div>
    </div>
  </div>

  <script>
    let rawFileBuffer = null;
    let fileName = "";
    
    // Controle do PDF
    let pdfjsDoc = null;
    let pdfLibDoc = null;
    
    // Estado da Interface
    let currentPage = 1;
    let activeTool = 'highlight'; // highlight, comment, underline, strike
    let activeColorHex = '#fef08a';
    let activeColorRGB = [0.99, 0.94, 0.54];
    let annotations = []; // Histórico
    let scale = 1.3;
    let commentCounter = 1; // Para numerar [CM1], [CM2]

    // Inicializa a interface das ferramentas
    setTool('highlight');

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      fileName = file.name;
      document.getElementById('fileName').innerText = fileName;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        rawFileBuffer = e.target.result;
        document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
      };
      reader.readAsArrayBuffer(file);
    }

    function setStatus(text, isError = false) {
      const el = document.getElementById('statusMsg');
      el.innerText = text;
      el.className = `text-xs font-medium mt-4 h-4 ${isError ? 'text-red-600' : 'text-gray-500'}`;
    }

    // --- LÓGICA DE START ---
    async function startProcess(mode) {
      if (!rawFileBuffer) return;
      setStatus("Processando documento...");
      
      try {
        let bufferToLoad = rawFileBuffer.slice(0);

        // A numeração agora sempre roda na opção "both" e na opção "number"
        if (mode === 'number' || mode === 'both') {
          bufferToLoad = await applyNumbering(bufferToLoad);
        }

        if (mode === 'number') {
          const blob = new Blob([bufferToLoad], { type: 'application/pdf' });
          triggerDownload(blob, fileName.replace('.pdf', '_numerado.pdf'));
          setStatus("Download concluído.");
          return;
        }

        // Abre o workspace
        pdfLibDoc = await PDFLib.PDFDocument.load(bufferToLoad);
        pdfjsDoc = await pdfjsLib.getDocument({ data: bufferToLoad }).promise;
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('mainBody').classList.remove('justify-center');
        document.getElementById('mainBody').classList.add('justify-start');
        
        const ws = document.getElementById('workspace');
        ws.classList.remove('hidden');
        ws.classList.add('grid');
        
        renderPage(1);
        
      } catch (err) {
        console.error(err);
        setStatus("Erro ao processar o PDF.", true);
      }
    }

    // --- NUMERAÇÃO DE LINHAS ---
    async function applyNumbering(buffer) {
      const tempPdfjs = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
      const tempLibDoc = await PDFLib.PDFDocument.load(buffer.slice(0));
      const font = await tempLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      const tolY = 4.0;
      const margemX = 20;
      let lineNumber = 1;

      for (let pageNum = 1; pageNum <= tempPdfjs.numPages; pageNum++) {
        const pdfjsPage = await tempPdfjs.getPage(pageNum);
        const pdfLibPage = tempLibDoc.getPage(pageNum - 1);
        const { height: pageHeight } = pdfLibPage.getSize();
        const textContent = await pdfjsPage.getTextContent();
        
        let yCoords = [];
        for (const item of textContent.items) {
          if (!item.str || item.str.trim() === '' || !item.transform) continue;
          const yPos = item.transform[5];
          if (yPos >= 45 && yPos <= (pageHeight - 50)) yCoords.push(yPos);
        }

        if (yCoords.length === 0) continue;
        yCoords.sort((a, b) => b - a);

        let uniqueY = [];
        for (const y of yCoords) {
          if (uniqueY.length === 0 || Math.abs(uniqueY[uniqueY.length - 1] - y) > tolY) {
            uniqueY.push(y);
          }
        }

        for (const y of uniqueY) {
          pdfLibPage.drawText(String(lineNumber), { x: margemX, y: y, size: 7.5, font: font, color: PDFLib.rgb(0.5, 0.5, 0.5) });
          lineNumber++;
        }
      }
      return await tempLibDoc.save();
    }

    // --- RENDERIZAÇÃO DO CANVAS ---
    async function renderPage(pageNum) {
      currentPage = pageNum;
      document.getElementById('pageIndicator').innerText = `Pág. ${pageNum} / ${pdfjsDoc.numPages}`;
      
      const page = await pdfjsDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      const wrapper = document.getElementById('pdfWrapper');
      wrapper.style.width = `${viewport.width}px`;
      wrapper.style.height = `${viewport.height}px`;

      const svg = document.getElementById('svgOverlay');
      svg.setAttribute('width', viewport.width);
      svg.setAttribute('height', viewport.height);

      await page.render({ canvasContext: context, viewport: viewport }).promise;

      // Camada de seleção
      const textLayerDiv = document.getElementById('textLayer');
      textLayerDiv.innerHTML = '';
      const textContent = await page.getTextContent();
      
      pdfjsLib.renderTextLayer({
        textContentSource: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
      });

      redrawAnnotations();
    }

    function changePage(delta) {
      const newPage = currentPage + delta;
      if (newPage >= 1 && newPage <= pdfjsDoc.numPages) renderPage(newPage);
    }

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('bg-blue-50', 'border-blue-300', 'text-blue-700', 'shadow-inner');
        btn.classList.add('bg-white', 'border-gray-200', 'text-gray-600');
      });
      const activeBtn = document.getElementById(`tool-${tool}`);
      activeBtn.classList.remove('bg-white', 'border-gray-200', 'text-gray-600');
      activeBtn.classList.add('bg-blue-50', 'border-blue-300', 'text-blue-700', 'shadow-inner');
    }

    function setColor(hex, rgb) {
      activeColorHex = hex;
      activeColorRGB = rgb;
    }

    // --- CAPTURA DE TEXTO (MOUSE) ---
    document.getElementById('textLayer').addEventListener('mouseup', function(e) {
      const selection = window.getSelection();
      if (selection.isCollapsed) return;

      const range = selection.getRangeAt(0);
      const rects = range.getClientRects();
      const wrapperRect = this.getBoundingClientRect();

      let capturedRects = [];
      for (let i = 0; i < rects.length; i++) {
        capturedRects.push({
          x: rects[i].left - wrapperRect.left,
          y: rects[i].top - wrapperRect.top,
          w: rects[i].width,
          h: rects[i].height
        });
      }

      if (capturedRects.length > 0) {
        const isComment = activeTool === 'comment';
        annotations.push({
          id: Date.now(),
          type: activeTool,
          page: currentPage,
          rects: capturedRects,
          colorHex: activeColorHex,
          colorRGB: activeColorRGB,
          text: selection.toString(),
          commentText: '', // O texto que o usuário digita
          cmIndex: isComment ? commentCounter++ : null,
          isEditing: isComment // Abre o input logo após selecionar
        });
      }

      selection.removeAllRanges();
      redrawAnnotations();
      updateSidebar();
    });

    // --- DESENHO NO BROWSER ---
    function redrawAnnotations() {
      const svg = document.getElementById('svgOverlay');
      svg.innerHTML = '';

      const pageAnns = annotations.filter(a => a.page === currentPage);
      
      pageAnns.forEach(ann => {
        ann.rects.forEach(r => {
          if (ann.type === 'highlight' || ann.type === 'comment') {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', r.x); rect.setAttribute('y', r.y);
            rect.setAttribute('width', r.w); rect.setAttribute('height', r.h);
            
            if (ann.type === 'comment') {
              rect.setAttribute('fill', '#fee2e2'); 
              rect.setAttribute('opacity', '0.6');
              rect.setAttribute('stroke', '#dc2626'); 
              rect.setAttribute('stroke-width', '1');
            } else {
              rect.setAttribute('fill', ann.colorHex); 
              rect.setAttribute('opacity', '0.45');
            }
            svg.appendChild(rect);
          } else if (ann.type === 'underline') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', r.x); line.setAttribute('y1', r.y + r.h - 1);
            line.setAttribute('x2', r.x + r.w); line.setAttribute('y2', r.y + r.h - 1);
            line.setAttribute('stroke', ann.colorHex); line.setAttribute('stroke-width', '2');
            svg.appendChild(line);
          } else if (ann.type === 'strike') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', r.x); line.setAttribute('y1', r.y + (r.h / 2));
            line.setAttribute('x2', r.x + r.w); line.setAttribute('y2', r.y + (r.h / 2));
            line.setAttribute('stroke', '#ef4444'); line.setAttribute('stroke-width', '1.5');
            svg.appendChild(line);
          }
        });
      });
    }

    // --- SIDEBAR E ESTADOS DE EDIÇÃO ---
    function updateSidebar() {
      const container = document.getElementById('sidebarList');
      container.innerHTML = '';

      if (annotations.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center mt-8 px-4">Nenhuma anotação.</p>';
        return;
      }

      annotations.forEach(ann => {
        const item = document.createElement('div');
        item.className = "bg-gray-50 border border-gray-200 rounded-xl p-3 shadow-sm";
        
        const typeLabel = ann.type === 'comment' ? `[CM${ann.cmIndex}] Comentário` : ann.type === 'highlight' ? 'Grifo' : ann.type === 'underline' ? 'Sublinhado' : 'Tachado';
        
        // Cabeçalho do item
        let html = `
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-gray-600 uppercase tracking-wider">${typeLabel} <span class="font-normal normal-case text-gray-400 ml-1">(Pág. ${ann.page})</span></span>
            <button onclick="removeAnnotation(${ann.id})" class="text-gray-400 hover:text-red-600 transition-colors" title="Excluir">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `;

        if (ann.type === 'comment') {
          if (ann.isEditing) {
            html += `
              <textarea id="textarea-${ann.id}" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none mb-2 min-h-[80px]" placeholder="Digite seu comentário...">${ann.commentText}</textarea>
              <button onclick="saveComment(${ann.id})" class="w-full bg-blue-100 text-blue-700 hover:bg-blue-200 text-xs font-bold py-2 rounded-lg transition-colors">Salvar comentário</button>
            `;
          } else {
            html += `
              <div class="text-sm text-gray-800 bg-white border border-gray-100 p-3 rounded-lg mb-2 shadow-sm">${ann.commentText || '<i class="text-gray-400">Vazio</i>'}</div>
              <button onclick="editComment(${ann.id})" class="w-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs font-bold py-2 rounded-lg transition-colors">Editar</button>
            `;
          }
        } else {
          const snippet = ann.text.length > 50 ? ann.text.substring(0, 50) + "..." : ann.text;
          html += `<div class="text-gray-500 text-xs border-l-2 border-gray-300 pl-2 italic mt-2">"${snippet}"</div>`;
        }

        item.innerHTML = html;
        container.appendChild(item);
      });
    }

    window.saveComment = function(id) {
      const ann = annotations.find(a => a.id === id);
      if(ann) {
        ann.commentText = document.getElementById(`textarea-${id}`).value;
        ann.isEditing = false;
        updateSidebar();
      }
    };

    window.editComment = function(id) {
      const ann = annotations.find(a => a.id === id);
      if(ann) {
        ann.isEditing = true;
        updateSidebar();
      }
    };

    window.removeAnnotation = function(id) {
      annotations = annotations.filter(a => a.id !== id);
      redrawAnnotations();
      updateSidebar();
    };

    // --- FUNÇÃO DE ENVOLVER TEXTO NAS CAIXAS PDF ---
    function splitTextToLines(text, maxWidth, font, fontSize) {
      const words = text.split(' ');
      let lines = [];
      let currentLine = words[0] || '';
      for (let i = 1; i < words.length; i++) {
        const word = words[i];
        const width = font.widthOfTextAtSize(currentLine + " " + word, fontSize);
        if (width < maxWidth) {
          currentLine += " " + word;
        } else {
          lines.push(currentLine);
          currentLine = word;
        }
      }
      lines.push(currentLine);
      return lines;
    }

    // --- EXPORTAÇÃO: EXPANSÃO DO PDF E DESENHO ---
    async function downloadFinalPDF() {
      const pages = pdfLibDoc.getPages();
      const font = await pdfLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);
      const fontBold = await pdfLibDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      
      const EXTRA_MARGIN_WIDTH = 250;

      for (let pageIdx = 0; pageIdx < pages.length; pageIdx++) {
        const page = pages[pageIdx];
        const pageAnns = annotations.filter(a => a.page === pageIdx + 1);
        const { width: originalWidth, height: pageHeight } = page.getSize();
        
        // Separa comentários das outras marcações
        const comments = pageAnns.filter(a => a.type === 'comment');
        
        // Se a página tem comentários, expande fisicamente a largura
        if (comments.length > 0) {
          page.setWidth(originalWidth + EXTRA_MARGIN_WIDTH);
          // Opcional: Fundo levemente cinza na margem nova
          page.drawRectangle({ x: originalWidth, y: 0, width: EXTRA_MARGIN_WIDTH, height: pageHeight, color: PDFLib.rgb(0.97, 0.97, 0.97) });
        }

        let nextAvailableY = pageHeight - 20; // Controle de colisão para as caixas de texto

        // Ordena comentários do topo para a base (Y maior no pdfLib é o topo)
        comments.sort((a, b) => b.rects[0].y - a.rects[0].y);

        pageAnns.forEach(ann => {
          const [r, g, b] = ann.colorRGB;

          if (ann.type === 'comment') {
            // Desenha o fundo rosinha claro sobre a palavra no texto
            let maxRightX = 0; // Ponto mais à direita do grifo para ligar a linha
            let basePdfY = 0;

            ann.rects.forEach(rect => {
              const pdfX = rect.x / scale;
              const pdfY = pageHeight - (rect.y / scale);
              const pdfW = rect.w / scale;
              const pdfH = rect.h / scale;
              
              if ((pdfX + pdfW) > maxRightX) {
                maxRightX = pdfX + pdfW;
                basePdfY = pdfY - (pdfH / 2); // Meio da seleção
              }
              
              page.drawRectangle({
                x: pdfX, y: pdfY - pdfH, width: pdfW, height: pdfH,
                color: PDFLib.rgb(1, 0.9, 0.9), // Fundo rosa claro
                borderColor: PDFLib.rgb(0.8, 0.2, 0.2), // Borda vermelha
                borderWidth: 1,
                opacity: 0.4,
                borderOpacity: 0.8
              });
            });

            // Configuração da Caixa Lateral
            const boxPadding = 8;
            const boxMarginLeft = 20;
            const contentWidth = EXTRA_MARGIN_WIDTH - boxMarginLeft - (boxPadding * 2) - 10;
            
            const title = `Commented [CM${ann.cmIndex}]: `;
            const lines = splitTextToLines(ann.commentText, contentWidth, font, 9);
            
            const textHeight = (lines.length + 1) * 12; // +1 pro titulo
            const boxHeight = textHeight + (boxPadding * 2);
            
            // Calculo de colisão: tenta alinhar com o grifo, mas empurra pra baixo se bater na caixa anterior
            let targetY = basePdfY + (boxHeight / 2);
            if (targetY > nextAvailableY) {
              targetY = nextAvailableY; // Empurra pra baixo (lembrando que Y desce de cima pra baixo)
            }
            nextAvailableY = targetY - boxHeight - 10; // Atualiza pro próximo

            const boxLeftX = originalWidth + boxMarginLeft;
            const boxBottomY = targetY - boxHeight;

            // Linha conectando o texto selecionado à caixa lateral
            page.drawLine({
              start: { x: maxRightX, y: basePdfY },
              end: { x: boxLeftX, y: targetY - (boxHeight / 2) },
              thickness: 1,
              color: PDFLib.rgb(0.8, 0.2, 0.2) // Vermelho
            });

            // Desenha a caixa Branca com Borda Vermelha (estilo Adobe)
            page.drawRectangle({
              x: boxLeftX, y: boxBottomY, width: contentWidth + (boxPadding * 2), height: boxHeight,
              color: PDFLib.rgb(1, 1, 1), // Branco
              borderColor: PDFLib.rgb(0.8, 0.2, 0.2), // Borda Vermelha
              borderWidth: 1
            });

            // Título [CMx] em Negrito
            page.drawText(title, {
              x: boxLeftX + boxPadding, y: boxBottomY + boxHeight - boxPadding - 9,
              size: 9, font: fontBold, color: PDFLib.rgb(0.1, 0.1, 0.1)
            });

            // Desenha as linhas do comentário
            let currentTextY = boxBottomY + boxHeight - boxPadding - 21;
            lines.forEach(line => {
              page.drawText(line, {
                x: boxLeftX + boxPadding, y: currentTextY,
                size: 9, font: font, color: PDFLib.rgb(0.2, 0.2, 0.2)
              });
              currentTextY -= 12;
            });

          } else {
            // Desenho padrão para Grifos normais, Tachar e Sublinhar
            ann.rects.forEach(rect => {
              const pdfX = rect.x / scale;
              const pdfY = pageHeight - (rect.y / scale);
              const pdfW = rect.w / scale;
              const pdfH = rect.h / scale;

              if (ann.type === 'highlight') {
                page.drawRectangle({ x: pdfX, y: pdfY - pdfH, width: pdfW, height: pdfH, color: PDFLib.rgb(r, g, b), opacity: 0.45 });
              } else if (ann.type === 'underline') {
                page.drawLine({ start: { x: pdfX, y: pdfY - pdfH }, end: { x: pdfX + pdfW, y: pdfY - pdfH }, thickness: 1.5, color: PDFLib.rgb(r, g, b) });
              } else if (ann.type === 'strike') {
                page.drawLine({ start: { x: pdfX, y: pdfY - (pdfH / 2) }, end: { x: pdfX + pdfW, y: pdfY - (pdfH / 2) }, thickness: 1.5, color: PDFLib.rgb(0.9, 0.2, 0.2) });
              }
            });
          }
        });
      }

      const finalBytes = await pdfLibDoc.save();
      const blob = new Blob([finalBytes], { type: 'application/pdf' });
      triggerDownload(blob, fileName.replace('.pdf', '_revisado.pdf'));
    }

    function triggerDownload(blob, outputName) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = outputName;
      link.click();
    }
  </script>
