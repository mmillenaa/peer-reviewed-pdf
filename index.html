<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar e Numerar PDF</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <style>
    .pdf-page-wrapper {
      position: relative;
      display: inline-block;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      margin-bottom: 20px;
      background: white;
    }
    canvas { display: block; }
    .textLayer {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      overflow: hidden;
      opacity: 0.2; 
      line-height: 1.0;
      --scale-factor: 1.3;
    }
    .textLayer ::selection { background: rgba(0, 0, 255, 0.3); }
    .textLayer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .annotationLayer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    #scrollContainer::-webkit-scrollbar { width: 10px; }
    #scrollContainer::-webkit-scrollbar-track { background: #f1f1f1; }
    #scrollContainer::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 5px; }
    #scrollContainer::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans transition-all duration-300" id="mainBody">

  <!-- TELA INICIAL -->
  <div id="startScreen" class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-gray-100 flex flex-col items-center">
    <img src="logo.png" alt="Logo" class="h-20 w-auto object-contain mx-auto mb-4" onerror="this.style.display='none'">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">Revisar e numerar PDF</h1>
    <p class="text-gray-500 text-sm mb-6">Numere linhas e ancore comentários no seu documento PDF.</p>

    <div class="w-full border-2 border-dashed border-gray-300 rounded-xl p-6 mb-5 hover:border-red-400 transition-colors bg-gray-50/50">
      <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="handleFileSelect(event)">
      <label for="pdfInput" class="cursor-pointer flex flex-col items-center">
        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
        </svg>
        <span class="text-gray-600 text-sm font-medium" id="fileName">Escolha um PDF</span>
      </label>
    </div>

    <div class="flex flex-col w-full gap-3">
      <button id="btnBoth" onclick="startProcess('both')" disabled class="action-btn w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-200 disabled:text-gray-400 text-white font-semibold py-3 px-4 rounded-xl transition-all shadow-md">
        Começar revisão
      </button>
      <button id="btnNumberOnly" onclick="startProcess('number')" disabled class="action-btn w-full bg-gray-50 hover:bg-gray-100 border border-gray-200 disabled:bg-gray-100 disabled:border-gray-200 disabled:text-gray-400 text-gray-600 font-medium py-2 rounded-lg transition-all text-sm">
        Apenas numerar linhas (Download)
      </button>
    </div>
    
    <div id="statusMsg" class="text-xs font-medium text-gray-500 mt-4 h-4"></div>

    <div class="mt-8 pt-5 border-t border-gray-100 w-full flex flex-col items-center gap-3">
      <p class="text-xs text-gray-500">
        Desenvolvido por <a href="https://mmillenaa.github.io/millena/" target="_blank" class="text-blue-600 font-semibold hover:underline">Millena Miranda Franco</a>
      </p>
    </div>
  </div>

  <!-- WORKSPACE -->
  <div id="workspace" class="max-w-[95%] w-full grid-cols-1 md:grid-cols-4 gap-6 hidden">
    <div class="md:col-span-3 bg-gray-50 rounded-xl border border-gray-200 flex flex-col overflow-hidden h-[90vh] shadow-lg">
      <div class="bg-white border-b border-gray-200 p-3 flex justify-between items-center px-4">
        <div class="flex items-center gap-2">
          <span class="text-xs text-gray-500 ml-2">Dica: use <b>Ctrl + F</b> para buscar no texto.</span>
        </div>
        <div class="text-sm text-gray-500 font-medium" id="pageIndicator">Carregando...</div>
      </div>
      <div class="flex-1 overflow-auto p-8 flex flex-col items-center bg-gray-200 relative" id="scrollContainer">
        <div id="pdfViewer" class="flex flex-col items-center gap-6 pb-10 w-full"></div>
      </div>
    </div>

    <!-- PAINEL LATERAL -->
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col h-[90vh] overflow-hidden">
      <div class="p-5 border-b border-gray-100 bg-gray-50">
        <div class="flex justify-between items-center mb-3">
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">Ferramentas</span>
          <button onclick="clearTool()" class="text-[10px] text-gray-500 hover:text-red-500 underline">Desativar</button>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-4">
          <button onclick="setTool('highlight')" id="tool-highlight" class="tool-btn py-2 rounded-lg text-xs font-semibold border bg-white border-gray-200 text-gray-600 transition-all">Grifar</button>
          <button onclick="setTool('comment')" id="tool-comment" class="tool-btn py-2 rounded-lg text-xs font-semibold border bg-white border-gray-200 text-gray-600 transition-all">Comentar</button>
          <button onclick="setTool('underline')" id="tool-underline" class="tool-btn py-2 rounded-lg text-xs font-semibold border bg-white border-gray-200 text-gray-600 transition-all">Sublinhar</button>
          <button onclick="setTool('strike')" id="tool-strike" class="tool-btn py-2 rounded-lg text-xs font-semibold border bg-white border-gray-200 text-gray-600 transition-all">Tachar</button>
        </div>
        
        <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block mb-2">Cor da Marcação</span>
        <div class="flex gap-3">
          <button onclick="setColor('#fef08a', [0.99, 0.94, 0.54])" class="w-7 h-7 rounded-full bg-yellow-200 border-2 border-yellow-300 transition-all"></button>
          <button onclick="setColor('#bbf7d0', [0.73, 0.97, 0.82])" class="w-7 h-7 rounded-full bg-green-200 border-2 border-green-300 transition-all"></button>
          <button onclick="setColor('#bfdbfe', [0.75, 0.86, 0.99])" class="w-7 h-7 rounded-full bg-blue-200 border-2 border-blue-300 transition-all"></button>
          <button onclick="setColor('#fecaca', [0.99, 0.79, 0.79])" class="w-7 h-7 rounded-full bg-red-200 border-2 border-red-300 transition-all"></button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-4 bg-white space-y-3" id="sidebarList">
        <p class="text-gray-400 text-sm text-center mt-8 px-4">Selecione uma ferramenta acima, depois selecione o texto no PDF.</p>
      </div>

      <div class="p-4 border-t border-gray-100 bg-white">
        <button onclick="downloadFinalPDF()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-3 rounded-xl transition-all shadow-md flex items-center justify-center gap-2">
          ⬇️ Baixar PDF final
        </button>
      </div>
    </div>
  </div>

  <script>
    let rawFileBuffer = null;
    let fileName = "";
    let pdfjsDoc = null;
    let pdfLibDoc = null;
    let activeTool = null; 
    let activeColorHex = '#fef08a';
    let activeColorRGB = [0.99, 0.94, 0.54];
    let annotations = []; 
    let scale = 1.3;
    let commentCounter = 1; 

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      fileName = file.name;
      document.getElementById('fileName').innerText = fileName;
      
      const reader = new FileReader();
      reader.onload = function(e) {
        rawFileBuffer = e.target.result;
        document.querySelectorAll('.action-btn').forEach(btn => btn.disabled = false);
      };
      reader.readAsArrayBuffer(file);
    }

    function setStatus(text, isError = false) {
      const el = document.getElementById('statusMsg');
      el.innerText = text;
      el.className = `text-xs font-medium mt-4 h-4 ${isError ? 'text-red-600' : 'text-gray-500'}`;
    }

    async function startProcess(mode) {
      if (!rawFileBuffer) return;
      setStatus("Processando documento...");
      
      try {
        let bufferToLoad = rawFileBuffer.slice(0);

        if (mode === 'number' || mode === 'both') {
          bufferToLoad = await applyNumbering(bufferToLoad);
        }

        if (mode === 'number') {
          const blob = new Blob([bufferToLoad], { type: 'application/pdf' });
          triggerDownload(blob, fileName.replace('.pdf', '_numerado.pdf'));
          setStatus("Download concluído.");
          return;
        }

        pdfLibDoc = await PDFLib.PDFDocument.load(bufferToLoad);
        pdfjsDoc = await pdfjsLib.getDocument({ data: bufferToLoad }).promise;
        
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('mainBody').classList.remove('justify-center');
        document.getElementById('mainBody').classList.add('justify-start');
        
        const ws = document.getElementById('workspace');
        ws.classList.remove('hidden');
        ws.classList.add('grid');
        
        await renderAllPages();
        
      } catch (err) {
        console.error(err);
        setStatus("Erro ao processar o PDF.", true);
      }
    }

    async function applyNumbering(buffer) {
      const tempPdfjs = await pdfjsLib.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
      const tempLibDoc = await PDFLib.PDFDocument.load(buffer.slice(0));
      const font = await tempLibDoc.embedFont(PDFLib.StandardFonts.Helvetica);

      const tolY = 4.0;
      const margemX = 20;
      let lineNumber = 1;

      for (let pageNum = 1; pageNum <= tempPdfjs.numPages; pageNum++) {
        const pdfjsPage = await tempPdfjs.getPage(pageNum);
        const pdfLibPage = tempLibDoc.getPage(pageNum - 1);
        const { height: pageHeight } = pdfLibPage.getSize();
        const textContent = await pdfjsPage.getTextContent();
        
        let yCoords = [];
        for (const item of textContent.items) {
          if (!item.str || item.str.trim() === '' || !item.transform) continue;
          const yPos = item.transform[5];
          if (yPos >= 45 && yPos <= (pageHeight - 50)) yCoords.push(yPos);
        }

        if (yCoords.length === 0) continue;
        yCoords.sort((a, b) => b - a);

        let uniqueY = [];
        for (const y of yCoords) {
          if (uniqueY.length === 0 || Math.abs(uniqueY[uniqueY.length - 1] - y) > tolY) {
            uniqueY.push(y);
          }
        }

        for (const y of uniqueY) {
          pdfLibPage.drawText(String(lineNumber), { x: margemX, y: y, size: 7.5, font: font, color: PDFLib.rgb(0.8, 0.1, 0.1) });
          lineNumber++;
        }
      }
      return await tempLibDoc.save();
    }

    async function renderAllPages() {
      const viewer = document.getElementById('pdfViewer');
      viewer.innerHTML = ''; 
      
      document.getElementById('pageIndicator').innerText = `Total: ${pdfjsDoc.numPages} páginas`;

      for (let i = 1; i <= pdfjsDoc.numPages; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'pdf-page-wrapper';
        wrapper.dataset.pageNum = i;
        wrapper.id = `page-wrapper-${i}`;

        const canvas = document.createElement('canvas');
        canvas.id = `canvas-${i}`;
        wrapper.appendChild(canvas);

        const textLayer = document.createElement('div');
        textLayer.className = 'textLayer';
        textLayer.id = `textLayer-${i}`;
        wrapper.appendChild(textLayer);

        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('class', 'annotationLayer');
        svg.id = `svgOverlay-${i}`;
        wrapper.appendChild(svg);

        viewer.appendChild(wrapper);

        const page = await pdfjsDoc.getPage(i);
        const viewport = page.getViewport({ scale: scale });

        canvas.height = viewport.height;
        canvas.width = viewport.width;
        wrapper.style.width = `${viewport.width}px`;
        wrapper.style.height = `${viewport.height}px`;

        const context = canvas.getContext('2d');
        await page.render({ canvasContext: context, viewport: viewport }).promise;

        const textContent = await page.getTextContent();
        
        pdfjsLib.renderTextLayer({ textContentSource: textContent, container: textLayer, viewport: viewport, textDivs: [] });
        textLayer.addEventListener('mouseup', handleTextSelection);
      }
      redrawAnnotations();
    }

    function setTool(tool) {
      activeTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('bg-blue-50', 'border-blue-300', 'text-blue-700', 'shadow-inner');
        btn.classList.add('bg-white', 'border-gray-200', 'text-gray-600');
      });
      const activeBtn = document.getElementById(`tool-${tool}`);
      if(activeBtn) {
        activeBtn.classList.remove('bg-white', 'border-gray-200', 'text-gray-600');
        activeBtn.classList.add('bg-blue-50', 'border-blue-300', 'text-blue-700', 'shadow-inner');
      }
    }

    function clearTool() {
      activeTool = null;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.remove('bg-blue-50', 'border-blue-300', 'text-blue-700', 'shadow-inner');
        btn.classList.add('bg-white', 'border-gray-200', 'text-gray-600');
      });
    }

    function setColor(hex, rgb) {
      activeColorHex = hex;
      activeColorRGB = rgb;
    }

    function handleTextSelection(e) {
      const selection = window.getSelection();
      if (selection.isCollapsed || !activeTool) return;

      const range = selection.getRangeAt(0);
      const rects = range.getClientRects();
      
      const wrapperRect = this.getBoundingClientRect();
      const pageNum = parseInt(this.parentElement.dataset.pageNum);

      let capturedRects = [];
      for (let i = 0; i < rects.length; i++) {
        capturedRects.push({
          x: rects[i].left - wrapperRect.left, y: rects[i].top - wrapperRect.top,
          w: rects[i].width, h: rects[i].height
        });
      }

      if (capturedRects.length > 0) {
        const isComment = activeTool === 'comment';
        annotations.push({
          id: Date.now(), type: activeTool, page: pageNum, rects: capturedRects,
          colorHex: activeColorHex, colorRGB: activeColorRGB, text: selection.toString(),
          commentText: '', cmIndex: isComment ? commentCounter++ : null, isEditing: isComment 
        });
      }

      selection.removeAllRanges();
      redrawAnnotations();
      updateSidebar();
    }

    function redrawAnnotations() {
      document.querySelectorAll('.annotationLayer').forEach(svg => svg.innerHTML = '');

      annotations.forEach(ann => {
        const svg = document.getElementById(`svgOverlay-${ann.page}`);
        if(!svg) return;

        ann.rects.forEach(r => {
          if (ann.type === 'highlight' || ann.type === 'comment') {
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', r.x); rect.setAttribute('y', r.y);
            rect.setAttribute('width', r.w); rect.setAttribute('height', r.h);
            
            if (ann.type === 'comment') {
              rect.setAttribute('fill', '#fee2e2'); rect.setAttribute('opacity', '0.6');
              rect.setAttribute('stroke', '#dc2626'); rect.setAttribute('stroke-width', '1');
            } else {
              rect.setAttribute('fill', ann.colorHex); rect.setAttribute('opacity', '0.45');
            }
            svg.appendChild(rect);
          } else if (ann.type === 'underline') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', r.x); line.setAttribute('y1', r.y + r.h - 1);
            line.setAttribute('x2', r.x + r.w); line.setAttribute('y2', r.y + r.h - 1);
            line.setAttribute('stroke', ann.colorHex); line.setAttribute('stroke-width', '2');
            svg.appendChild(line);
          } else if (ann.type === 'strike') {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', r.x); line.setAttribute('y1', r.y + (r.h / 2));
            line.setAttribute('x2', r.x + r.w); line.setAttribute('y2', r.y + (r.h / 2));
            line.setAttribute('stroke', '#ef4444'); line.setAttribute('stroke-width', '1.5');
            svg.appendChild(line);
          }
        });
      });
    }

    function updateSidebar() {
      const container = document.getElementById('sidebarList');
      container.innerHTML = '';

      if (annotations.length === 0) {
        container.innerHTML = '<p class="text-gray-400 text-sm text-center mt-8 px-4">Selecione uma ferramenta acima, depois selecione o texto no PDF.</p>';
        return;
      }

      annotations.forEach(ann => {
        const item = document.createElement('div');
        item.className = "bg-gray-50 border border-gray-200 rounded-xl p-3 shadow-sm";
        
        const typeLabel = ann.type === 'comment' ? `[CM${ann.cmIndex}] Comentário` : ann.type === 'highlight' ? 'Grifo' : ann.type === 'underline' ? 'Sublinhado' : 'Tachado';
        
        let html = `
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-bold text-gray-600 uppercase tracking-wider">${typeLabel} <span class="font-normal normal-case text-gray-400 ml-1">(Pág. ${ann.page})</span></span>
            <button onclick="removeAnnotation(${ann.id})" class="text-gray-400 hover:text-red-600 transition-colors" title="Excluir">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `;

        if (ann.type === 'comment') {
          if (ann.isEditing) {
            html += `
              <textarea id="textarea-${ann.id}" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none mb-2 min-h-[80px]" placeholder="Digite seu comentário...">${ann.commentText}</textarea>
              <button onclick="saveComment(${ann.id})" class="w-full bg-blue-100 text-blue-700 hover:bg-blue-200 text-xs font-bold py-2 rounded-lg transition-colors">Salvar comentário</button>
            `;
          } else {
            html += `
              <div class="text-sm text-gray-800 bg-white border border-gray-100 p-3 rounded-lg mb-2 shadow-sm">${ann.commentText || '<i class="text-gray-400">Vazio</i>'}</div>
              <button onclick="editComment(${ann.id})" class="w-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-xs font-bold py-2 rounded-lg transition-colors">Editar</button>
            `;
          }
        } else {
          const snippet = ann.text.length > 50 ? ann.text.substring(0, 50) + "..." : ann.text;
          html += `<div class="text-gray-500 text-xs border-l-2 border-gray-300 pl-2 italic mt-2">"${snippet}"</div>`;
        }

        item.innerHTML = html;
        container.appendChild(item);
      });
    }

    window.saveComment = function(id) {
      const ann = annotations.find(a => a.id === id);
      if(ann) { ann.commentText = document.getElementById(`textarea-${id}`).value; ann.isEditing = false; updateSidebar(); }
    };
    window.editComment = function(id) {
      const ann = annotations.find(a => a.id === id);
      if(ann) { ann.isEditing = true; updateSidebar(); }
    };
    window.removeAnnotation = function(id) {
      annotations = annotations.filter(a => a.id !== id);
      redrawAnnotations(); updateSidebar();
    };

    function splitTextToLines(text, maxWidth, font, fontSize) {
      const rawLines = text.split('\n'); 
      let finalLines = [];

      rawLines.forEach(rawLine => {
        if (rawLine.trim() === '') { finalLines.push(''); return; }
        const words = rawLine.split(' ');
        let currentLine = words[0] || '';
        
        for (let i = 1; i < words.length; i++) {
          const word = words[i];
          const width = font.widthOfTextAtSize(currentLine + " " + word, fontSize);
          
          if (width < maxWidth) { currentLine += " " + word; } 
          else { finalLines.push(currentLine); currentLine = word; }
        }
        finalLines.push(currentLine);
      });
      return finalLines;
    }

    // --- NOVA LÓGICA: PÁGINAS INTERCALADAS PARA COMENTÁRIOS LONGOS ---
    async function downloadFinalPDF() {
      // Criamos um documento novo para poder intercalar as páginas livremente
      const newPdfDoc = await PDFLib.PDFDocument.create();
      const font = await newPdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
      const fontBold = await newPdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
      
      for (let pageIdx = 0; pageIdx < pdfLibDoc.getPageCount(); pageIdx++) {
        // 1. Copia e adiciona a página original ao novo PDF
        const [copiedPage] = await newPdfDoc.copyPages(pdfLibDoc, [pageIdx]);
        newPdfDoc.addPage(copiedPage);
        const { width: originalWidth, height: pageHeight } = copiedPage.getSize();

        const pageAnns = annotations.filter(a => a.page === pageIdx + 1);
        const comments = pageAnns.filter(a => a.type === 'comment');

        // 2. Desenha as marcações na página original
        pageAnns.forEach(ann => {
          const [r, g, b] = ann.colorRGB;

          if (ann.type === 'comment') {
            let firstRectX = null;
            let firstRectY = null;

            ann.rects.forEach(rect => {
              const pdfX = rect.x / scale; const pdfY = pageHeight - (rect.y / scale);
              const pdfW = rect.w / scale; const pdfH = rect.h / scale;
              
              if (firstRectX === null) { firstRectX = pdfX; firstRectY = pdfY; }

              // Desenha a caixa vermelha de referência no texto
              copiedPage.drawRectangle({
                x: pdfX, y: pdfY - pdfH, width: pdfW, height: pdfH,
                color: PDFLib.rgb(1, 0.9, 0.9), borderColor: PDFLib.rgb(0.8, 0.2, 0.2), 
                borderWidth: 1, opacity: 0.4, borderOpacity: 0.8
              });
            });

            // Insere a tag "[CMx]" levemente acima do grifo no texto original para cruzamento
            if (firstRectX !== null && firstRectY !== null) {
               copiedPage.drawText(`[CM${ann.cmIndex}]`, { 
                 x: Math.max(firstRectX - 5, 10), y: firstRectY + 2, size: 8, font: fontBold, color: PDFLib.rgb(0.8, 0.1, 0.1) 
               });
            }
          } else {
            // Desenha grifos, sublinhados ou tachados normais
            ann.rects.forEach(rect => {
              const pdfX = rect.x / scale; const pdfY = pageHeight - (rect.y / scale);
              const pdfW = rect.w / scale; const pdfH = rect.h / scale;
              if (ann.type === 'highlight') { copiedPage.drawRectangle({ x: pdfX, y: pdfY - pdfH, width: pdfW, height: pdfH, color: PDFLib.rgb(r, g, b), opacity: 0.45 }); } 
              else if (ann.type === 'underline') { copiedPage.drawLine({ start: { x: pdfX, y: pdfY - pdfH }, end: { x: pdfX + pdfW, y: pdfY - pdfH }, thickness: 1.5, color: PDFLib.rgb(r, g, b) }); } 
              else if (ann.type === 'strike') { copiedPage.drawLine({ start: { x: pdfX, y: pdfY - (pdfH / 2) }, end: { x: pdfX + pdfW, y: pdfY - (pdfH / 2) }, thickness: 1.5, color: PDFLib.rgb(0.9, 0.2, 0.2) }); }
            });
          }
        });

        // 3. Intercala (Cria páginas extras) logo após a página atual, SE houver comentários
        if (comments.length > 0) {
           // Ordena de cima para baixo
           comments.sort((a, b) => {
             let yA = Math.max(...a.rects.map(r => r.y));
             let yB = Math.max(...b.rects.map(r => r.y));
             return yA - yB; 
           });

           let commentPage = newPdfDoc.addPage([originalWidth, pageHeight]);
           let cursorY = pageHeight - 60; // Começa a escrever do topo

           // Cabeçalho da página de comentários
           commentPage.drawText(`COMENTÁRIOS DA PÁGINA ${pageIdx + 1}`, { x: 50, y: cursorY, size: 14, font: fontBold, color: PDFLib.rgb(0.8, 0.2, 0.2) });
           cursorY -= 40;

           for (let i = 0; i < comments.length; i++) {
              const ann = comments[i];
              // Quebra o texto usando a largura real da página (com margem de 50px de cada lado)
              const textWidthLimit = originalWidth - 100; 
              const textLines = splitTextToLines(ann.commentText, textWidthLimit, font, 11);
              
              // Verifica se o comentário atual cabe nesta página, se não, cria outra
              const spaceNeeded = 15 + (textLines.length * 15) + 20; 
              if (cursorY - spaceNeeded < 50) {
                 commentPage = newPdfDoc.addPage([originalWidth, pageHeight]);
                 cursorY = pageHeight - 60; // Reseta pro topo da nova página clonada em branco
              }

              // Escreve a Tag [CMx]
              commentPage.drawText(`[CM${ann.cmIndex}]`, { x: 50, y: cursorY, size: 11, font: fontBold, color: PDFLib.rgb(0.1, 0.1, 0.1) });
              cursorY -= 15;

              // Escreve o parágrafo do comentário
              textLines.forEach(line => {
                 commentPage.drawText(line, { x: 50, y: cursorY, size: 11, font: font, color: PDFLib.rgb(0.2, 0.2, 0.2) });
                 cursorY -= 15;
              });

              cursorY -= 20; // Espaçamento extra entre diferentes comentários
           }
        }
      }

      const finalBytes = await newPdfDoc.save();
      const blob = new Blob([finalBytes], { type: 'application/pdf' });
      triggerDownload(blob, fileName.replace('.pdf', '_revisado_intercalado.pdf'));
    }

    function triggerDownload(blob, outputName) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = outputName;
      link.click();
    }
  </script>
